<style>
:root {
  --bg:#181818; --card:#212121; --muted:#d0d0d0; --accent:#fce029; --datebox:#303030; --text-main:#fff;
  --topbar-height-desktop:58px; --topbar-height-mobile:48px; --fab-share-bottom:12px;
}

/* Base + topbar */
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text-main);font-family:'Comfortaa',cursive;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.book-btn{background:var(--accent);color:#000;padding:10px 16px;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block;border:none;cursor:pointer;font-family:inherit;line-height:1.2;font-size:1rem;transition:background .15s ease,transform .15s ease}
.book-btn:hover{background:#ffe974;transform:translateY(-1px)}
.book-btn:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.topbar-bleed{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:rgba(24,24,24,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10002;pointer-events:none}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;padding-left:24px;padding-top:env(safe-area-inset-top,0px);height:calc(var(--topbar-height-desktop) + env(safe-area-inset-top,0px));box-sizing:border-box;z-index:10003;border-bottom:1px solid rgba(255,255,255,.3);background:rgba(24,24,24,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar-left{display:flex;align-items:center;height:100%}
.topbar-left.home-link{color:inherit;text-decoration:none}
.topbar-left.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.logo{height:36px;width:36px;border-radius:8px;margin-right:12px;object-fit:cover}
.brand{font-size:1.45rem;font-weight:700;letter-spacing:.5px;color:#fff}
@media (max-width:600px){.topbar{padding-left:10px;height:calc(var(--topbar-height-mobile) + env(safe-area-inset-top,0px))}.logo{height:26px;width:26px;margin-right:8px}.brand{font-size:1rem}}
.topbar-spacer{width:100%;height:calc(var(--topbar-height-desktop) + env(safe-area-inset-top,0px))}
@media (max-width:600px){.topbar-spacer{height:calc(var(--topbar-height-mobile) + env(safe-area-inset-top,0px))}}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f5f5;--card:#fff;--muted:#444;--accent:#0a75bc;--datebox:#ececec;--text-main:#181818}
  .brand{color:#242424}
  .topbar,.topbar-bleed{background:rgba(255,255,255,.55)!important;border-bottom:1px solid rgba(0,0,0,.08);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
  .book-btn{color:#fff}
  .book-btn:hover{background:#095e94}
}

/* Layout */
.wrap{max-width:1200px;margin:0 auto;padding:20px 18px calc(var(--mobile-bottom-pad,16px) + env(safe-area-inset-bottom,0px));box-sizing:border-box}
@media (min-width:769px){.wrap{padding-top:12px}}
@media (max-width:768px){.wrap{padding:14px 12px calc(var(--mobile-bottom-pad,16px) + env(safe-area-inset-bottom,0px))}}
@media (min-width:960px){.wrap{padding-bottom:24px}}

/* Divider */
.divider{width:100%;height:1px;margin:26px 0;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 1px 0 rgba(255,255,255,.02) inset;border-radius:1px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.page-grid>.divider{margin:14px 0}
@media (prefers-color-scheme: light){
  .divider{background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,.06));box-shadow:0 1px 0 rgba(0,0,0,.06) inset;}
}

.section-divider{margin:26px 0}

/* "No date yet" notice (event has no upcoming calendar entry) */
.no-date{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin:0 0 22px;padding:20px 18px;border-radius:14px;background:var(--card);border:1.5px solid rgba(255,255,255,.08)}
.no-date[hidden]{display:none}
.no-date__text{margin:0;font-size:1rem;line-height:1.6;color:var(--muted)}
@media (prefers-color-scheme: light){.no-date{border-color:rgba(0,0,0,.06);box-shadow:0 6px 22px rgba(0,0,0,.08)}}

/* Grid */
.page-grid{display:grid;grid-template-columns:1fr;grid-template-areas:"banner" "title" "tagline" "divider" "content";gap:12px}
@media (min-width:960px){
  .page-grid{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"banner side" "title side" "tagline side" "divider side" "content side";column-gap:18px;row-gap:12px}
}

/* Banner */
.banner{grid-area:banner;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 6px 22px rgba(0,0,0,.8)}
.banner img{width:100%;height:clamp(360px,64vh,720px);object-fit:cover;object-position:center}
@media (max-width:768px){.banner{margin-left:-2px;margin-right:-2px;border-radius:12px}.banner img{height:clamp(220px,40vh,420px)}}

/* Titles */
.heading{color:var(--accent);font-size:1.9rem;font-weight:700;letter-spacing:.2px;margin:0 0 18px}
@media (max-width:959px){.heading{text-align:center}}
.title-row{grid-area:title;display:flex;align-items:center;gap:8px;margin-bottom:4px}
@media (max-width:959px){.title-row{justify-content:center}}
.tagline{grid-area:tagline;margin:0 0 10px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-align:left}
@media (max-width:959px){.tagline{text-align:center}}

/* Content */
.content{grid-area:content}
.section-title{margin:0 0 16px;font-size:1.12rem;letter-spacing:.6px;text-transform:uppercase;font-weight:900}
.closing-note{margin-bottom:6px}
.prose{font-size:1.04rem;line-height:1.7}
.prose p{margin:0 0 16px}

/* Uniform video portrait blocks */
.video-portrait{aspect-ratio:9/16;width:100%;max-width:clamp(240px,48vw,360px);margin:10px 0;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.8);background:#000;overflow:hidden;cursor:pointer}
.video-portrait iframe{width:100%;height:100%;border:0;pointer-events:none}
.recap-grid-portrait{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));justify-items:start}
.recap-grid-portrait .video-portrait{max-width:clamp(160px,28vw,220px)}
#about-video .video-portrait{max-width:clamp(160px,28vw,220px);margin-left:0;margin-right:auto}

/* Video lightbox */
.vid-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;z-index:10020}
.vid-modal[hidden]{display:none}
.vid-stage{position:relative;width:clamp(280px,90vw,960px);max-height:90vh;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6);background:#000;display:flex;flex-direction:column}
.vid-stage.portrait{width:clamp(220px,60vw,420px);aspect-ratio:9/16}
.vid-stage:not(.portrait){aspect-ratio:16/9}
.vid-stage iframe{flex:1;width:100%;height:100%;border:0;background:#000}
.vid-close{position:absolute;top:10px;right:10px;padding:8px 12px;border-radius:999px;border:0;font-weight:700;font-size:.9rem;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;z-index:1}
.vid-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
  .vid-modal{padding:14px}
  .vid-close{font-size:.85rem;padding:6px 10px}
}
@media (prefers-color-scheme: light){
  .vid-modal{background:rgba(255,255,255,.92)}
  .vid-close{background:rgba(0,0,0,.6)}
}

/* Script offer */
.script-offer{position:relative;padding:26px 24px;border-radius:14px;background:rgba(33,33,33,.92);box-shadow:0 12px 34px rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.06);overflow:hidden;max-width:620px;margin:0 auto 0 0}
.script-offer::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(252,24,41,.18),rgba(252,224,41,0));opacity:.85;pointer-events:none}
.script-offer__content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;max-width:540px;margin:0 auto}
.script-offer__text{margin:0;font-size:1.02rem;line-height:1.6;color:var(--muted)}
.script-offer__cta{align-self:center;margin-top:4px;display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;white-space:nowrap;box-sizing:border-box;max-width:100%}
.script-offer__cta:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:768px){
  .script-offer{padding:22px 18px;max-width:100%;margin:0}
  .script-offer__content{max-width:none}
  .script-offer__cta{width:100%;max-width:320px}
}
@media (prefers-color-scheme: light){
  .script-offer{background:rgba(255,255,255,.92);border-color:rgba(0,0,0,.06);box-shadow:0 12px 34px rgba(0,0,0,.08)}
  .script-offer::before{background:linear-gradient(135deg,rgba(252,24,41,.18),rgba(252,224,41,0))}
  .script-offer__text{color:#333}
}

/* Right card */
.side-card{grid-area:side;display:none}
@media (min-width:960px){
  .side-card{display:block}
  .info-card{position:sticky;top:calc(var(--topbar-height-desktop) + 16px);background:var(--card);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.8);padding:18px 16px 18px;border:1.5px solid rgba(255,255,255,.08);overflow:hidden}
  @media (prefers-color-scheme: light){.info-card{border-color:rgba(0,0,0,.06)}}
  .info-card h3{margin:0 0 14px;font-size:13px;letter-spacing:.45px;text-transform:uppercase;color:var(--muted);text-align:center}
  .schedule-list{display:grid;gap:10px;margin-bottom:10px}
  .schedule-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .when{font-weight:900;font-size:16px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .schedule-date-select{display:inline-block;width:175px;max-width:100%;margin:0;padding:0 24px 0 0;border:0;border-radius:0;-webkit-appearance:none;appearance:none;background-color:var(--card);background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 8px) 50%,calc(100% - 3px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;color:var(--text-main);font:inherit;font-size:14px;font-weight:900;text-align:left;text-align-last:left;direction:ltr;cursor:pointer;box-shadow:none}
  .schedule-date-select:hover,.schedule-date-select:focus{background-color:var(--card);box-shadow:none}
  .schedule-date-select:focus-visible{outline:0}
  .schedule-date-select[hidden]{display:none}
  .when-time{font-size:12.5px;color:var(--muted);font-weight:800}
  .where{font-weight:900;font-size:16px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
  .where-time{font-size:12.5px;color:var(--muted);font-weight:800}
  .inline-link{font-size:12.5px;font-weight:800;color:var(--muted);text-decoration:none}
  .sched-commercial{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
  .sched-seats{margin:0;font-size:12.5px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
  .sched-seats::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ec27b;flex:0 0 auto}
  .sched-seats[data-low]{color:var(--accent)}
  .sched-seats[data-low]::before{background:currentColor}
  .sched-price{margin:0;font-size:12.5px;font-weight:900;color:var(--text-main);white-space:nowrap}
  .btn-primary{background:var(--accent);color:#000;border:0;font-weight:900}
  .btn-primary:hover{filter:brightness(1.05)}
  .wide-cta{display:block;width:100%;text-align:center;padding:11px 18px;border-radius:999px;margin:6px 0 8px;box-sizing:border-box;text-decoration:none}
  .row-div{height:1px;margin:12px 0;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:0}
  .facts{display:grid;gap:10px;margin:10px 0 4px}
  .fact{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.55}
  .fact .label{color:var(--muted)}
  .share-row{display:flex;justify-content:center;margin-top:10px}
  .share-row .icon{width:18px;height:18px;margin-right:6px}
  .share-row .btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(24,24,24,.35);color:var(--text-main);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-decoration:none}
  @media (prefers-color-scheme: light){ .share-row .btn{background:rgba(255,255,255,.65);border-color:rgba(0,0,0,.15);color:inherit} }

  .sched-flip{perspective:1400px}
  .sched-flip__inner{
    position:relative;
    transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.2,.75,.2,1), height .62s cubic-bezier(.2,.75,.2,1);
  }
  .sched-flip__face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .sched-flip__front{position:relative;transform:rotateY(0deg)}
  .sched-flip__back{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg)}
  .sched-flip.is-flipped .sched-flip__inner{transform:rotateY(180deg)}
  .sched-flip.is-flipped .sched-flip__front{position:absolute;top:0;left:0;width:100%}

  .info-card__extras{
    overflow:hidden;
    transition:max-height .5s cubic-bezier(.2,.75,.2,1), opacity .3s ease, margin-top .4s ease;
  }
  .info-card__extras[data-collapsed]{opacity:0;max-height:0 !important;margin-top:0;pointer-events:none}
  #scheduleDivider{transition:opacity .3s ease, margin .4s ease, height .4s ease}
  #scheduleDivider[data-collapsed]{opacity:0;height:0;margin:0}

  @media (prefers-reduced-motion: reduce){
    .info-card__extras,#scheduleDivider{transition:none}
  }

  .gl-book--compact{display:grid;gap:11px;text-align:left}
  .gl-book--compact .gl-book__title{margin:0 0 2px;font-size:13px;letter-spacing:.45px;text-transform:uppercase;color:var(--muted);text-align:center}
  .gl-book--compact .book-field{display:grid;gap:4px}
  .gl-book--compact .book-field label{display:grid;gap:4px;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--muted);text-transform:none}
  .gl-book--compact .book-field input{padding:9px 11px;font-size:16px;border-radius:9px}
  .gl-book--compact .book-field select{padding:9px 11px;font-size:13px;border-radius:9px}
  .gl-book--compact .book-hint{font-size:11.5px}
  .gl-book--compact .book-error{font-size:12px}
  .gl-book--compact .book-phone-cc{padding:0 9px;font-size:14px;border-radius:9px 0 0 9px}
  .gl-book--compact .book-phone input{border-radius:0 9px 9px 0}
  .gl-book--compact .book-stepper{grid-template-columns:40px 62px 40px}
  .gl-book--compact .book-step{font-size:18px}
  .gl-book--compact .book-total{padding-top:10px;font-size:13.5px}
  .gl-book--compact .book-total strong{font-size:21px}
  .gl-book--compact .book-pay{padding:12px 16px;font-size:15px;margin:0}
  .gl-book--compact .book-legal{font-size:10.5px;line-height:1.5}
  .gl-book__cancel{
    background:none;border:0;padding:2px 0;margin:0;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);text-decoration:underline;
  }
  .gl-book__cancel:hover{color:var(--text-main)}
  .gl-book__cancel:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    .sched-flip__inner{transition:height .2s linear}
    .sched-flip.is-flipped .sched-flip__inner{transform:none}
    .sched-flip__back{transform:none;visibility:hidden}
    .sched-flip.is-flipped .sched-flip__back{visibility:visible}
    .sched-flip.is-flipped .sched-flip__front{visibility:hidden}
  }
}

.book-field[hidden]{display:none}
.book-field select{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;font:inherit;background:var(--card);color:var(--text-main);border:1px solid rgba(255,255,255,.2)}
.more-dates{margin:0;color:var(--muted);font-size:.82rem;font-weight:800}

/* Microbar (mobile only) */
.mobile-info-bar{position:fixed;left:0;right:0;top:calc(var(--topbar-height-mobile) + env(safe-area-inset-top,0px));z-index:10001;padding:6px 12px 4px;background:rgba(24,24,24,.07);border-bottom:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform:translate3d(0,-100%,0);opacity:0;pointer-events:none;transition:transform .2s ease, opacity .15s ease;will-change:transform,opacity}
@media (prefers-color-scheme: light){.mobile-info-bar{background:rgba(255,255,255,.55);border-bottom:1px solid rgba(0,0,0,.08)}}
.mobile-info-bar.show{transform:translate3d(0,0,0);opacity:1;pointer-events:auto}
.mobile-info-inner{display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:1200px;margin:0 auto}
.micro-title{font-size:1.02rem;font-weight:900;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micro-line{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:nowrap}
.micro-title-row{align-items:flex-end}
.micro-line[hidden]{display:none}
.micro-meta{font-size:.84rem;color:var(--muted);font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micro-left{flex:1;min-width:0}
.micro-right{margin-left:auto;flex-shrink:0;text-align:right}
.micro-title-row .micro-right{font-size:.88rem;font-weight:900;color:var(--text-main)}
#microRightTitle{font-size:.84rem;font-weight:800;color:var(--muted);line-height:1.2;align-self:flex-end;padding-bottom:1px}
.micro-action{font-size:.82rem;color:var(--muted);font-weight:800;text-decoration:underline;text-underline-offset:2px;margin-left:auto;white-space:nowrap}
.micro-action[hidden]{display:none}
.micro-line:empty{display:none}
.micro-line span:empty{display:none}
@media (min-width:601px){.mobile-info-bar{top:calc(var(--topbar-height-desktop) + env(safe-area-inset-top,0px))}}
@media (min-width:960px){.mobile-info-bar{display:none !important}}

/* FABs (mobile) */
.fab-book,.fab-share{position:fixed;z-index:10000;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;padding:12px 16px;text-decoration:none}
.fab-book{left:12px;right:12px;bottom:6px;background:var(--accent);color:#000;font-weight:900;justify-content:center;text-align:center}
.fab-book[hidden]{display:none}
.fab-no-date,.fab-sold-out{transition:transform .24s ease,opacity .24s ease}
.fab-book.fab-sold-out{opacity:1}
.fab-no-date.is-scroll-hidden,.fab-sold-out.is-scroll-hidden{transform:translateY(calc(100% + 18px));opacity:0;pointer-events:none}
.fab-share{right:12px;bottom:var(--fab-share-bottom,12px);background:rgba(24,24,24,.35);color:var(--text-main);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.fab-share .fab-share-label{font-weight:900;font-size:.95rem}
@media (prefers-color-scheme: light){
  .btn-primary,.fab-book{color:#fff}
  .fab-share{background:rgba(255,255,255,.65);border-color:rgba(0,0,0,.15);color:inherit}
}
@media (min-width:960px){.fab-book,.fab-share{display:none}}
@media (prefers-reduced-motion:reduce){.fab-no-date,.fab-sold-out{transition:none}}

/* Override the slide-out treatment without editing its shared definition.
   Moving a fixed element below the viewport paints its accent background into
   iOS Safari's bottom safe area; fading in place avoids that browser artifact. */
.fab-no-date,.fab-sold-out{transition:opacity .2s ease,visibility 0s linear .2s}
.fab-no-date.is-scroll-hidden,.fab-sold-out.is-scroll-hidden{transform:none;opacity:0;visibility:hidden;pointer-events:none}

.book-drawer{position:fixed;inset:0;z-index:10030}
.book-drawer[hidden]{display:none}

.book-drawer__backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.62);
  opacity:0;transition:opacity .3s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.book-drawer.is-open .book-drawer__backdrop{opacity:1}

.book-drawer__sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--card);color:var(--text-main);
  border-radius:20px 20px 0 0;
  border-top:1.5px solid rgba(255,255,255,.10);
  box-shadow:0 -12px 40px rgba(0,0,0,.55);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  max-height:92vh;
  max-height:92dvh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  transform:translateY(101%);
  transition:transform .36s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.book-drawer.is-open .book-drawer__sheet{transform:translateY(0)}

.book-drawer__grabber{
  width:40px;height:4px;border-radius:999px;margin:2px auto 12px;
  background:rgba(255,255,255,.28);
}

.book-drawer__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.book-drawer__headings{min-width:0}
.book-drawer__title{margin:0;font-size:1.15rem;line-height:1.25;font-weight:900}
.book-drawer__meta{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.book-drawer__close{
  flex:0 0 auto;display:grid;place-items:center;
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:var(--text-main);cursor:pointer;padding:0;
}
.book-drawer__close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.book-drawer__body,.book-drawer__body .gl-book,.book-drawer__body .book-field{min-width:0;max-width:100%}
.book-drawer__body .gl-book{display:grid;gap:14px;overflow-x:hidden}
.book-drawer__body .book-field label{display:grid;gap:5px;font-size:12.5px;font-weight:800;color:var(--muted);min-width:0;max-width:100%}
.book-drawer__body input,.book-drawer__body select{width:100%;min-width:0;max-width:100%;box-sizing:border-box;background:var(--bg);color:var(--text-main);border:1.5px solid color-mix(in srgb,var(--muted) 30%,transparent);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px}
.book-drawer__body select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

.book-drawer-open .fab-book,
.book-drawer-open .fab-share{display:none !important}
.book-drawer-open,
.book-drawer-open body{overflow:hidden}

@media (prefers-color-scheme: light){
  .book-drawer__sheet{border-top-color:rgba(0,0,0,.08);box-shadow:0 -12px 40px rgba(0,0,0,.22)}
  .book-drawer__grabber{background:rgba(0,0,0,.22)}
  .book-drawer__close{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.14)}
}

@media (prefers-reduced-motion: reduce){
  .book-drawer__sheet,.book-drawer__backdrop{transition:none}
}

@media (min-width:960px){
  .book-drawer{display:none !important}
}
