<script>
(async function(){
  const CALENDAR_URL = "{{ site.baseurl | default: '' }}/assets/data/calendar.json";
  const BASEURL = "{{ site.baseurl | default: '' }}";
  const PAGE_SLUG = {{ page.slug | jsonify }} || '';
  const CLEAN = v => (v == null) ? "" : String(v).trim();

  function stripDomain(p){ return p.replace(/^https?:\/\/[^/]+/, ''); }
  function stripBaseAndSlash(p){
    let x = stripDomain(p);
    if (BASEURL && x.startsWith(BASEURL)) x = x.slice(BASEURL.length);
    return x.replace(/\/+$/, '');
  }

  const pagePath = stripBaseAndSlash(location.pathname || '/');
  const titleFallback = (document.getElementById('eventTitle')?.textContent || '').trim();

  function normalizeSlug(value){
    if (!value) return '';
    return value.toString()
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
  }

  function fmtDateOnly(date, timezone){
    const parts = new Intl.DateTimeFormat('en-US', {
      weekday: 'short',
      day: '2-digit',
      month: 'short',
      year: '2-digit',
      timeZone: timezone
    }).formatToParts(date).reduce((acc, part) => {
      if (part.type !== 'literal') acc[part.type] = part.value;
      return acc;
    }, {});
    return `${parts.weekday || ''}, ${parts.day || ''} ${parts.month || ''} '${parts.year || ''}`.trim();
  }

  function fmtTime(date, timezone){
    const str = new Intl.DateTimeFormat('en-US', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: true,
      timeZone: timezone
    }).format(date).replace(/\u202f/g, ' ');
    return str.toUpperCase();
  }

  function dayKey(date, timezone){
    return new Intl.DateTimeFormat('en-CA', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      timeZone: timezone
    }).format(date);
  }

  function parseStart(entry){
    if (!entry || !entry.start) return null;
    const d = new Date(entry.start);
    return isNaN(d.getTime()) ? null : d;
  }

  function makeICS({title, start, endTime=null, durationHours=3, locationText='', locationUrl='', description=''}){
    const dt = new Date(start);
    const parsedEnd = endTime ? new Date(endTime) : null;
    const end = parsedEnd && !isNaN(parsedEnd.getTime())
      ? parsedEnd
      : new Date(dt.getTime() + durationHours*60*60*1000);
    const pad = n => String(n).padStart(2,'0');
    const stamp = (x)=> x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+pad(x.getUTCSeconds())+'Z';
    const loc = locationUrl ? `${locationText} (${locationUrl})` : locationText;
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Games Lab//Events//EN','BEGIN:VEVENT',
      `DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(dt)}`,`DTEND:${stamp(end)}`,
      `SUMMARY:${title}`,`LOCATION:${loc.replace(/,/g,'\\,')}`,`DESCRIPTION:${description}`,
      'END:VEVENT','END:VCALENDAR'
    ];
    const content = lines.join('\r\n');
    try {
      if (URL && typeof URL.createObjectURL === 'function' && typeof Blob === 'function'){
        return URL.createObjectURL(new Blob([content], { type:'text/calendar;charset=utf-8' }));
      }
    } catch (error) {
      console.warn('Calendar file fallback used', error);
    }
    return 'data:text/calendar;charset=utf8,' + encodeURIComponent(content);
  }

  let match = null;
  let matches = [];
  let timezone = 'Asia/Kolkata';

  try {
    const res = await fetch(CALENDAR_URL + '?v=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('Calendar fetch failed: ' + res.status);
    const data = await res.json();
    const events = Array.isArray(data.events) ? data.events : [];
    timezone = CLEAN(data.timezone) || timezone;

    const pathSlug = normalizeSlug(pagePath.split('/').filter(Boolean).pop());

    matches = events.filter(entry => {
      if (!entry) return false;
      const entrySlug = normalizeSlug(entry.slug || entry.title);
      if (PAGE_SLUG && entrySlug === normalizeSlug(PAGE_SLUG)) return true;
      if (pathSlug && entrySlug === pathSlug) return true;
      if (titleFallback && entry.title && entry.title.toLowerCase() === titleFallback.toLowerCase()) return true;
      return false;
    }).sort((a, b) => Date.parse(a.start || '') - Date.parse(b.start || ''));
    match = matches[0] || null;
  } catch (e) {
    console.error('Calendar load error', e);
  }

  const scHeading = document.getElementById('scheduleHeading');
  const scBlock   = document.getElementById('scheduleBlock');
  const scWhen    = document.getElementById('scWhen');
  const scDateSelect = document.getElementById('scDateSelect');
  const scWhere   = document.getElementById('scWhere');
  const scTime    = document.getElementById('scTime');
  const scAdd     = document.getElementById('scAddCal');
  const scDir     = document.getElementById('scDir');
  const scSeats   = document.getElementById('scSeats');
  const scPrice   = document.getElementById('scPrice');
  const scBook    = document.getElementById('scBook');
  const fabBook   = document.getElementById('fabBook');
  const fabNoDate = document.getElementById('fabNoDate');
  const shareFab  = document.getElementById('shareFab');

  // Older cached event markup included a redundant multi-date note in the
  // schedule card. The selector now communicates this, so remove that note.
  document.querySelectorAll('#scheduleBlock .sched-more-dates, #scMoreDates').forEach(el => el.remove());
  const noDateNotice = document.getElementById('noDateNotice');

  const M = {
    bar: document.getElementById('mobileInfoBar'),
    title: document.getElementById('microTitle'),
    line1: document.getElementById('microLine1'),
    line2: document.getElementById('microLine2'),
    line3: document.getElementById('microLine3'),
    L1: document.getElementById('microLeft1'),
    L2: document.getElementById('microLeft2'),
    L3: document.getElementById('microLeft3'),
    A1: document.getElementById('microAction1'),
    A2: document.getElementById('microAction2'),
    R0: document.getElementById('microRightTitle'),
    R1: document.getElementById('microRight1'),
    R2: document.getElementById('microRight2'),
    R3: document.getElementById('microRight3'),
  };

  const fallbackTicket = {{ page.ticket_link | jsonify }} || '';

  const TICKETING = {
    enabled: {{ site.ticketing.enabled | default: false | jsonify }},
    apiBase: String({{ site.ticketing.api_base | default: '' | jsonify }} || '').replace(/\/+$/, ''),
    bookPath: {{ '/book/' | relative_url | jsonify }},
    ticketPath: {{ '/ticket/' | relative_url | jsonify }}
  };

  const dFormat = "{{ page.highlights.format | default: '' | escape }}";
  const dDuration = "{{ page.highlights.duration | default: '' | escape }}";
  const dGroup = "{{ page.highlights.group_size | default: '' | escape }}";
  const dDiff = "{{ page.highlights.difficulty | default: '' | escape }}";

  function assignText(el, value){
    if (!el) return;
    const text = (value || '').trim();
    if (text){
      el.textContent = text;
      el.removeAttribute('hidden');
    } else {
      el.textContent = '';
      el.setAttribute('hidden','');
    }
  }

  let fabMeasureRetries = 0;
  function updateFabSpacing(){
    const docEl = document.documentElement;
    // getClientRects() is empty for a display:none element. Without that check
    // the desktop breakpoint (where .fab-book is display:none but carries no
    // hidden attribute) measures 0 and re-queues itself forever.
    const activeFab = [fabBook, fabNoDate].find(el => el
      && !el.hasAttribute('hidden')
      && !el.classList.contains('is-scroll-hidden')
      && el.getClientRects().length > 0);
    const bookVisible = Boolean(activeFab);
    let bookHeight = 0;
    if (bookVisible){
      const rect = activeFab.getBoundingClientRect();
      bookHeight = rect.height || activeFab.offsetHeight || 0;
      if (!bookHeight && fabMeasureRetries < 10){
        fabMeasureRetries += 1;
        requestAnimationFrame(updateFabSpacing);
        return;
      }
    }
    fabMeasureRetries = 0;

    let shareBottom = 12;
    if (shareFab){
      if (bookVisible){ shareBottom += Math.round(bookHeight + 8); }
      docEl.style.setProperty('--fab-share-bottom', shareBottom + 'px');
    }

    let pad = 16;
    if (bookVisible && window.innerWidth < 960){
      pad = Math.max(22, Math.round(bookHeight + 22));
    }
    docEl.style.setProperty('--mobile-bottom-pad', pad + 'px');
  }

  const scheduleDate = parseStart(match);
  const scheduleEnd = parseStart({ start: match?.end });
  const todayKey = dayKey(new Date(), timezone);
  const eventDayKey = scheduleDate ? dayKey(scheduleDate, timezone) : '';
  const isUpcoming = Boolean(scheduleDate) && (scheduleEnd
    ? scheduleEnd.getTime() > Date.now()
    : eventDayKey >= todayKey);

  if (match?.location_warning && match.raw_location){
    console.warn('Calendar location mismatch for "%s": "%s"', titleFallback, match.raw_location);
  }

  const locationText = match?.location_name || 'To be Announced';
  const locationUrl = match?.location_map_url || '';
  const timeStr = scheduleDate ? fmtTime(scheduleDate, timezone) : '';
  const whenText = scheduleDate ? fmtDateOnly(scheduleDate, timezone) : '';

  const occurrenceSlug = normalizeSlug(match?.slug || match?.title || PAGE_SLUG);
  const occurrenceDay = (match?.day_key || eventDayKey || '').replace(/-/g, '');
  const occurrenceId = (occurrenceSlug && occurrenceDay) ? (occurrenceSlug + '-' + occurrenceDay) : '';

  function occurrenceIdFor(entry){
    const slug = normalizeSlug(entry?.slug || entry?.title || PAGE_SLUG);
    const date = parseStart(entry);
    const key = (entry?.day_key || (date ? dayKey(date, timezone) : '')).replace(/-/g, '');
    return slug && key ? slug + '-' + key : '';
  }

  const useInHouse = Boolean(TICKETING.enabled && TICKETING.apiBase && occurrenceId);
  const ticket = useInHouse
    ? (TICKETING.bookPath + '?o=' + encodeURIComponent(occurrenceId))
    : fallbackTicket;

  if (useInHouse){
    [scBook, fabBook].forEach(el => {
      if (!el) return;
      el.setAttribute('target', '_self');
      el.removeAttribute('rel');
    });
  }

  if (M.title) M.title.textContent = titleFallback;

  if (isUpcoming && scheduleDate){
    scHeading && scHeading.removeAttribute('hidden');
    if (scBlock) scBlock.hidden = false;
    scWhen && (scWhen.textContent = whenText);
    scWhere && (scWhere.textContent = locationText || '');
    scTime && (scTime.textContent = timeStr ? ' | ' + timeStr : '');
    if (scAdd) scAdd.href = makeICS({ title: titleFallback, start: scheduleDate, endTime:match?.end, durationHours:3, locationText, locationUrl, description:location.href });
    if (scDir){
      if (locationUrl){
        scDir.href = locationUrl;
        scDir.removeAttribute('hidden');
      } else {
        scDir.setAttribute('hidden','');
        scDir.removeAttribute('href');
      }
    }
    if (ticket){
      if (scBook) scBook.href = ticket;
      if (fabBook){
        fabBook.href = ticket;
        fabBook.removeAttribute('hidden');
      }
      requestAnimationFrame(updateFabSpacing);
    } else {
      if (fabBook){ fabBook.setAttribute('hidden',''); }
      updateFabSpacing();
    }
  } else {
    scHeading && scHeading.setAttribute('hidden','');
    if (scBlock) scBlock.hidden = true;
    if (fabBook){ fabBook.setAttribute('hidden',''); }
    if (noDateNotice) noDateNotice.removeAttribute('hidden');
    if (fabNoDate) fabNoDate.removeAttribute('hidden');
    updateFabSpacing();
  }

  // Notice-style mobile CTAs should not cover the page while somebody reads
  // downward. This applies to both the no-date CTA and a Book button that is
  // later converted into a sold-out notice by the availability request.
  if (fabNoDate || fabBook){
    let lastScrollY = Math.max(0, window.scrollY);
    let scrollTicking = false;

    function scrollAwareFabs(){
      return [fabNoDate, fabBook].filter(el => el
        && !el.hasAttribute('hidden')
        && (el === fabNoDate || el.classList.contains('fab-sold-out')));
    }

    function updateNoticeFabsOnScroll(){
      const currentY = Math.max(0, window.scrollY);
      const delta = currentY - lastScrollY;
      const noticeFabs = scrollAwareFabs();

      if (currentY <= 12 || delta < -4){
        noticeFabs.forEach(el => el.classList.remove('is-scroll-hidden'));
      } else if (delta > 4){
        noticeFabs.forEach(el => el.classList.add('is-scroll-hidden'));
      }

      lastScrollY = currentY;
      scrollTicking = false;
      updateFabSpacing();
    }

    window.addEventListener('scroll', () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(updateNoticeFabsOnScroll);
    }, { passive:true });
  }

  if (isUpcoming && scheduleDate){
    assignText(M.R0, '');
    const timePart = timeStr ? ` | ${timeStr}` : '';
    if (M.L1){ M.L1.textContent = whenText + timePart; M.line1?.removeAttribute('hidden'); }
    assignText(M.R1, '');
    if (M.A1){
      M.A1.textContent = 'Add to Calendar';
      M.A1.href = makeICS({ title: titleFallback, start: scheduleDate, endTime:match?.end, durationHours:3, locationText, locationUrl, description:location.href });
      M.A1.setAttribute('download', 'games-lab-event.ics');
      M.A1.hidden = false;
    }

    if (M.L2){ M.L2.textContent = locationText || ''; }
    if (locationText){ M.line2?.removeAttribute('hidden'); } else { M.line2?.setAttribute('hidden',''); }
    assignText(M.R2, '');
    if (M.A2){
      if (locationUrl){
        M.A2.textContent = 'Get Directions';
        M.A2.href = locationUrl;
        M.A2.hidden = false;
      } else {
        M.A2.hidden = true;
        M.A2.removeAttribute('href');
      }
    }

    if (M.L3){ M.L3.textContent = ''; }
    assignText(M.R3, '');
    M.line3?.setAttribute('hidden','');
  } else {
    assignText(M.R0, dGroup);
    const hasLine1 = Boolean((dFormat || '').trim() || (dDuration || '').trim());
    if (M.line1){
      if (hasLine1){ M.line1.removeAttribute('hidden'); }
      else { M.line1.setAttribute('hidden',''); }
    }
    if (M.L1) M.L1.textContent = dFormat;
    assignText(M.R1, dDuration);
    if (M.A1){ M.A1.hidden = true; M.A1.removeAttribute('href'); }

    const hasLine2 = Boolean((dDiff || '').trim());
    if (M.line2){
      if (hasLine2){ M.line2.removeAttribute('hidden'); }
      else { M.line2.setAttribute('hidden',''); }
    }
    if (M.L2) M.L2.textContent = dDiff;
    assignText(M.R2, '');
    if (M.A2){ M.A2.hidden = true; M.A2.removeAttribute('href'); }

    if (M.L3){ M.L3.textContent = ''; }
    assignText(M.R3, '');
    M.line3?.setAttribute('hidden','');
  }

  if (useInHouse && isUpcoming){
    (async function(){
      const DESKTOP_MIN = 960;
      const flip      = document.getElementById('schedFlip');
      const flipInner = document.getElementById('schedFlipInner');
      const frontFace = document.getElementById('schedFront');
      const backFace  = document.getElementById('schedBack');
      const bookForm  = backFace ? backFace.querySelector('[data-gl-book]') : null;

      const cardExtras = document.getElementById('cardExtras');
      const schedDivider = document.getElementById('scheduleDivider');

      const isDesktop = () => window.innerWidth >= DESKTOP_MIN;
      const canFlip = Boolean(flip && flipInner && frontFace && backFace && bookForm && window.GLBooking);

      function setExtrasCollapsed(collapsed){
        [cardExtras, schedDivider].forEach(el => {
          if (!el) return;
          if (collapsed){
            if (el === cardExtras) el.style.maxHeight = el.scrollHeight + 'px';
            void el.offsetHeight;
            el.setAttribute('data-collapsed', '');
          } else {
            el.removeAttribute('data-collapsed');
            if (el === cardExtras){
              el.style.maxHeight = el.scrollHeight + 'px';
              setTimeout(() => {
                if (!el.hasAttribute('data-collapsed')) el.style.maxHeight = 'none';
              }, 520);
            }
          }
        });
      }

      let occ = null;
      let mounted = null;
      let flipped = false;
      let bookingReady = false;
      let pendingDesktopOpen = false;

      function faceHeight(face){
        return Math.ceil(face.getBoundingClientRect().height);
      }

      function syncHeight(animate){
        if (!flipInner) return;
        const target = flipped ? backFace : frontFace;
        const to = faceHeight(target);
        if (!to) return;
        if (!animate){
          flipInner.style.height = to + 'px';
          return;
        }
        const from = flipInner.offsetHeight;
        flipInner.style.height = from + 'px';
        void flipInner.offsetHeight;
        flipInner.style.height = to + 'px';
      }

      function watchFaces(){
        if (typeof ResizeObserver === 'undefined') return;
        let raf = null;
        const observer = new ResizeObserver(() => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => syncHeight(false));
        });
        observer.observe(frontFace);
        observer.observe(backFace);
      }

      function setFaceActive(face, active){
        if (!face) return;
        face.setAttribute('aria-hidden', active ? 'false' : 'true');
        if (active) face.removeAttribute('inert');
        else face.setAttribute('inert', '');
      }

      function showForm(){
        if (!canFlip) return false;
        flipped = true;
        flip.classList.add('is-flipped');
        setFaceActive(frontFace, false);
        setFaceActive(backFace, true);
        setExtrasCollapsed(true);
        if (scHeading) scHeading.setAttribute('hidden', '');
        syncHeight(true);

        if (!mounted){
          mounted = window.GLBooking.mount(bookForm, {
            api: TICKETING.apiBase,
            occurrence: occ,
            timezone: timezone,
            ticketPath: TICKETING.ticketPath,
            onCancel: showSchedule,
            onResize: () => { if (flipped) syncHeight(true); },
            onSoldOut: () => { markSoldOut(); showSchedule(); }
          });
        } else {
          mounted.setOccurrence(occ);
        }

        setTimeout(() => { if (flipped && mounted) mounted.focus(); }, 380);
        return true;
      }

      function showSchedule(){
        if (!canFlip) return;
        flipped = false;
        flip.classList.remove('is-flipped');
        setFaceActive(backFace, false);
        setFaceActive(frontFace, true);
        setExtrasCollapsed(false);
        if (scHeading) scHeading.removeAttribute('hidden');
        syncHeight(true);
        if (scBook) scBook.focus();
      }

      // Intercept desktop booking immediately, rather than waiting for all
      // occurrence requests. This prevents the fallback link from navigating
      // away while the flip-card data is still loading.
      scBook?.addEventListener('click', (event) => {
        if (!isDesktop() || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        if (!bookingReady){
          pendingDesktopOpen = true;
          return;
        }
        showForm();
      });

      const drawer      = document.getElementById('bookDrawer');
      const drawerSheet = document.getElementById('bookDrawerSheet');
      const drawerMeta  = document.getElementById('bookDrawerMeta');
      const drawerForm  = drawer ? drawer.querySelector('[data-gl-book]') : null;
      const canDrawer   = Boolean(drawer && drawerSheet && drawerForm && window.GLBooking);

      let drawerMounted = null;
      let drawerOpen = false;
      let lastFocus = null;

      function openDrawer(){
        if (!canDrawer || drawerOpen) return false;
        if (defaultBookableChoice){
          setCurrentOccurrence(defaultBookableChoice.occurrence.id);
          const dateSelect = drawerForm.querySelector('[data-gl-date]');
          if (dateSelect) dateSelect.value = defaultBookableChoice.occurrence.id;
        }
        lastFocus = document.activeElement;
        drawerOpen = true;

        drawer.hidden = false;
        drawer.setAttribute('aria-hidden', 'false');
        void drawer.offsetHeight;
        drawer.classList.add('is-open');
        document.documentElement.classList.add('book-drawer-open');

        if (!drawerMounted){
          drawerMounted = window.GLBooking.mount(drawerForm, {
            api: TICKETING.apiBase,
            occurrence: occ,
            timezone: timezone,
            ticketPath: TICKETING.ticketPath,
            onSoldOut: () => { markSoldOut(); closeDrawer(); }
          });
        } else {
          drawerMounted.setOccurrence(occ);
        }

        drawerSheet.focus({ preventScroll: true });
        return true;
      }

      function closeDrawer(){
        if (!canDrawer || !drawerOpen) return;
        drawerOpen = false;
        drawer.classList.remove('is-open');
        drawer.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('book-drawer-open');

        setTimeout(() => {
          if (!drawerOpen) drawer.hidden = true;
        }, 380);

        if (lastFocus && typeof lastFocus.focus === 'function'){
          lastFocus.focus({ preventScroll: true });
        }
      }

      function trapFocus(e){
        if (!drawerOpen || e.key !== 'Tab') return;
        const focusables = drawerSheet.querySelectorAll(
          'a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
        );
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first){
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last){
          e.preventDefault(); first.focus();
        }
      }

      function markSoldOut(){
        [scBook, fabBook].forEach(el => {
          if (!el) return;
          el.textContent = 'We’re sold out for this date';
          el.setAttribute('aria-disabled','true');
          el.removeAttribute('href');
          el.style.pointerEvents = 'none';
          if (el === fabBook){
            el.classList.add('fab-sold-out');
            el.style.removeProperty('opacity');
          } else {
            el.style.opacity = '.6';
          }
        });
        updateFabSpacing();
      }

      let occurrenceChoices = [];
      let defaultBookableChoice = null;

      function updateDrawerMeta(){
        if (!drawerMeta || !occ) return;
        const start = new Date(occ.starts_at);
        const bits = [occ.venue_name];
        if (occurrenceChoices.length <= 1) bits.push(fmtDateOnly(start, timezone));
        bits.push(fmtTime(start, timezone));
        drawerMeta.textContent = bits.filter(Boolean).join('  ·  ');
      }

      function setCurrentOccurrence(id){
        const choice = occurrenceChoices.find(item => item.occurrence.id === id);
        if (!choice) return;
        occ = choice.occurrence;
        mounted?.setOccurrence(occ);
        drawerMounted?.setOccurrence(occ);
        updateDrawerMeta();
        if (flipped) syncHeight(true);
      }

      function dateOnlyLabel(choice){
        return fmtDateOnly(new Date(choice.occurrence.starts_at), timezone);
      }

      function renderScheduleChoice(choice){
        const item = choice.occurrence;
        const entry = choice.entry;
        const start = new Date(item.starts_at);
        const mapUrl = item.venue_map_url || entry.location_map_url || '';
        const venue = item.venue_name || entry.location_name || 'To be Announced';
        if (scWhen) scWhen.textContent = dateOnlyLabel(choice);
        if (scWhere) scWhere.textContent = venue;
        if (scTime) scTime.textContent = fmtTime(start, timezone) ? ' | ' + fmtTime(start, timezone) : '';
        if (scAdd) scAdd.href = makeICS({ title:titleFallback, start, endTime:entry.end, durationHours:3, locationText:venue, locationUrl:mapUrl, description:location.href });
        if (scDir){
          if (mapUrl){ scDir.href = mapUrl; scDir.removeAttribute('hidden'); }
          else { scDir.setAttribute('hidden',''); scDir.removeAttribute('href'); }
        }

        const left = Math.max(0, Number(item.available) || 0);
        const capacity = Number(item.capacity) || 0;
        if (scSeats){
          scSeats.textContent = choice.bookable
            ? (left === 1 ? 'Only 1 ticket left' : left + (capacity ? ' of ' + capacity : '') + ' tickets left')
            : (item.status === 'closed' && left > 0 ? 'Registrations paused' : 'Sold out');
          scSeats.toggleAttribute('data-low', !choice.bookable || left <= 6);
          scSeats.removeAttribute('hidden');
        }
        if (scPrice && item.price_paise > 0){
          scPrice.textContent = '₹' + (item.price_paise / 100).toLocaleString('en-IN') + ' per person';
          scPrice.removeAttribute('hidden');
        }
        if (scBook){
          scBook.textContent = choice.bookable ? 'Book Now' : 'Unavailable for this date';
          scBook.toggleAttribute('aria-disabled', !choice.bookable);
          scBook.style.pointerEvents = choice.bookable ? '' : 'none';
          scBook.style.opacity = choice.bookable ? '' : '.6';
          if (choice.bookable) scBook.href = TICKETING.bookPath + '?o=' + encodeURIComponent(item.id);
          else scBook.removeAttribute('href');
        }
      }

      function setupDateSelectors(primaryChoice, defaultChoice){
        if (scDateSelect){
          scDateSelect.innerHTML = '';
          occurrenceChoices.forEach(choice => {
            const option = document.createElement('option');
            option.value = choice.occurrence.id;
            option.textContent = dateOnlyLabel(choice);
            scDateSelect.appendChild(option);
          });
          scDateSelect.hidden = occurrenceChoices.length <= 1;
          if (scWhen) scWhen.hidden = occurrenceChoices.length > 1;
          scDateSelect.value = primaryChoice.occurrence.id;
          scDateSelect.addEventListener('change', () => {
            const choice = occurrenceChoices.find(item => item.occurrence.id === scDateSelect.value);
            if (!choice) return;
            setCurrentOccurrence(choice.occurrence.id);
            renderScheduleChoice(choice);
          });
        }

        if (drawerForm){
          const field = drawerForm.querySelector('[data-gl-date-field]');
          const select = drawerForm.querySelector('[data-gl-date]');
          if (!field || !select) return;
          field.hidden = occurrenceChoices.length <= 1;
          select.innerHTML = '';
          occurrenceChoices.forEach(choice => {
            const option = document.createElement('option');
            option.value = choice.occurrence.id;
            option.textContent = dateOnlyLabel(choice);
            option.disabled = !choice.bookable;
            select.appendChild(option);
          });
          select.value = defaultChoice.occurrence.id;
          select.addEventListener('change', () => setCurrentOccurrence(select.value));
        }
      }

      try {
        occurrenceChoices = (await Promise.all(matches.map(async entry => {
          const id = occurrenceIdFor(entry);
          if (!id) return null;
          const occurrence = await window.GLBooking.fetchOccurrence(TICKETING.apiBase, id).catch(() => null);
          if (!occurrence) return null;
          return {
            entry,
            occurrence,
            bookable: Boolean(occurrence.on_sale) && Number(occurrence.available) > 0,
          };
        }))).filter(Boolean);
        if (!occurrenceChoices.length) return;

        const primaryChoice = occurrenceChoices[0];
        const defaultChoice = occurrenceChoices.find(choice => choice.bookable) || primaryChoice;
        const primaryOcc = primaryChoice.occurrence;
        defaultBookableChoice = defaultChoice.bookable ? defaultChoice : null;
        occ = primaryOcc;
        const soldOut = !occurrenceChoices.some(choice => choice.bookable);
        bookingReady = !soldOut && canFlip;

        if (primaryOcc.price_paise > 0){
          assignText(M.R0, '₹' + (primaryOcc.price_paise / 100).toLocaleString('en-IN') + ' / person');
        }

        if (soldOut){
          markSoldOut();
        } else {
          if (fabBook) fabBook.textContent = 'Book Now';
        }

        renderScheduleChoice(primaryChoice);
        setupDateSelectors(primaryChoice, defaultChoice);
        updateDrawerMeta();

        const isPlainClick = (e) =>
          !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && e.button === 0;

        if (!soldOut && canFlip){
          setFaceActive(backFace, false);
          setFaceActive(frontFace, true);
          syncHeight(false);
          watchFaces();

          if (document.fonts && document.fonts.ready){
            document.fonts.ready.then(() => syncHeight(false));
          }

          let hTimer = null;
          window.addEventListener('resize', () => {
            if (hTimer) clearTimeout(hTimer);
            hTimer = setTimeout(() => syncHeight(false), 150);
          });

          if (pendingDesktopOpen){
            pendingDesktopOpen = false;
            showForm();
          }
        }

        if (!soldOut && canDrawer){
          fabBook?.addEventListener('click', (e) => {
            if (isDesktop() || !isPlainClick(e)) return;
            if (openDrawer()) e.preventDefault();
          });

          drawer.querySelectorAll('[data-drawer-close]').forEach((el) => {
            el.addEventListener('click', closeDrawer);
          });

          window.addEventListener('keydown', trapFocus);
        }

        window.addEventListener('keydown', (e) => {
          if (e.key !== 'Escape') return;
          if (drawerOpen) closeDrawer();
          else if (flipped) showSchedule();
        });

        requestAnimationFrame(updateFabSpacing);
      } catch (e) {
        console.error('Booking controls could not be initialised', e);
      }
    })();
  }

  (function(){
    const microbar = M.bar;
    const banner = document.querySelector('.banner');
    if (!microbar || !banner) return;
    function isDesktop(){ return window.innerWidth >= 960; }
    function update(){
      if (isDesktop()){ microbar.classList.remove('show'); microbar.setAttribute('aria-hidden','true'); return; }
      const topbarH = (document.querySelector('.topbar')?.offsetHeight || 56);
      const rect = banner.getBoundingClientRect();
      const bottomY = rect.bottom + window.scrollY;
      const shouldShow = window.scrollY >= (bottomY - topbarH);
      microbar.classList.toggle('show', shouldShow);
      microbar.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
    }
    window.addEventListener('load', update, { passive:true });
    window.addEventListener('scroll', update, { passive:true });
    window.addEventListener('resize', update);
    window.__updateMicrobarVis = update;
  })();

  updateFabSpacing();
  window.addEventListener('resize', ()=>{ updateFabSpacing(); });

  (function(){
    async function sharePage(){
      const data = { title: document.title, text: document.title, url: location.href };
      try{
        if (navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(data.url); alert('Link copied to clipboard'); }
      }catch(e){}
    }
    document.getElementById('shareBtnSide')?.addEventListener('click', sharePage);
    shareFab?.addEventListener('click', sharePage);
  })();
})();
</script>

<!-- Video Lightbox -->
<script>
(function(){
  const modal  = document.getElementById('vidModal');
  const stage  = document.getElementById('vidStage');
  const frame  = document.getElementById('vidFrame');
  const close  = document.getElementById('vidClose');
  if (!modal || !frame || !stage) return;

  function buildEmbed(url){
    const result = { url: '', vendor: 'generic' };
    if (!url) return result;

    let parsed = null;
    try{
      parsed = new URL(url, window.location.href);
    }catch(err){ parsed = null; }

    const urlLower = url.toLowerCase();
    const looksYoutube = /youtube\.com|youtu\.be/.test(urlLower);

    if (parsed){
      const host = parsed.hostname.replace(/^www\./,'').toLowerCase();
      if (host === 'youtu.be'){
        const id = parsed.pathname.replace(/^\/+|\/+$/g,'');
        const carry = parsed.searchParams;
        parsed = new URL('https://www.youtube.com/embed/' + id);
        carry.forEach((value, key) => { parsed.searchParams.set(key, value); });
      }

      const normalizedHost = parsed.hostname.replace(/^www\./,'').toLowerCase();
      if (normalizedHost === 'youtube.com'){
        result.vendor = 'youtube';
        if (parsed.pathname === '/watch'){
          const vid = parsed.searchParams.get('v');
          if (vid){
            parsed.pathname = '/embed/' + vid;
            parsed.searchParams.delete('v');
          }
        } else if (parsed.pathname.startsWith('/live/')){
          const parts = parsed.pathname.split('/').filter(Boolean);
          const vid = parts.pop();
          if (vid) parsed.pathname = '/embed/' + vid;
        }
        parsed.searchParams.set('enablejsapi','1');
        if (!parsed.searchParams.has('rel')) parsed.searchParams.set('rel','0');
      }

      parsed.searchParams.set('autoplay','1');
      if (!parsed.searchParams.has('playsinline')) parsed.searchParams.set('playsinline','1');
      result.url = parsed.toString();
      return result;
    }

    let final = url;
    const extras = [];
    if (!/[?&]autoplay=/.test(final)) extras.push('autoplay=1');
    if (!/[?&]playsinline=/.test(final)) extras.push('playsinline=1');
    if (looksYoutube){
      result.vendor = 'youtube';
      if (!/[?&]enablejsapi=/.test(final)) extras.push('enablejsapi=1');
      if (!/[?&]rel=/.test(final)) extras.push('rel=0');
    }
    if (extras.length){
      final += (final.includes('?') ? '&' : '?') + extras.join('&');
    }
    result.url = final;
    return result;
  }

  function pingYoutube(){
    if (frame.dataset.vendor !== 'youtube') return;
    try{
      frame.contentWindow?.postMessage(JSON.stringify({ event:'command', func:'playVideo', args:[] }), '*');
    }catch(err){}
  }

  frame.addEventListener('load', () => {
    if (frame.dataset.vendor === 'youtube'){
      requestAnimationFrame(pingYoutube);
      setTimeout(pingYoutube, 200);
    }
  });

  function openFrom(el){
    const url = el.getAttribute('data-embed') || el.querySelector('iframe')?.src || '';
    const embed = buildEmbed(url);
    if (el.classList.contains('video-portrait')) stage.classList.add('portrait'); else stage.classList.remove('portrait');
    frame.dataset.vendor = embed.vendor;
    frame.src = embed.url || 'about:blank';
    modal.hidden = false;
    requestAnimationFrame(() => {
      try{ frame.focus({ preventScroll: true }); }
      catch(err){ try{ frame.focus(); }catch(_){} }
    });
    if (embed.vendor === 'youtube') pingYoutube();
  }
  function shut(){
    frame.src = 'about:blank';
    delete frame.dataset.vendor;
    stage.classList.remove('portrait');
    modal.hidden = true;
  }

  document.querySelectorAll('[data-embed], .video-portrait').forEach(v => {
    v.addEventListener('click', () => openFrom(v));
  });
  close.addEventListener('click', shut);
  modal.addEventListener('click', (e)=>{ if (e.target === modal) shut(); });
  window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && !modal.hidden) shut(); });
})();
</script>
