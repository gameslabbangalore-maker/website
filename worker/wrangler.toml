name = "gameslab-ticketing"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *", "17 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gameslab-ticketing"
database_id = "12713527-2751-4bc6-ad84-a6c67ba08d6c"

[vars]
CALENDAR_ICS_URL = "https://calendar.google.com/calendar/ical/gameslab.bangalore%40gmail.com/public/basic.ics"
SITE_ORIGIN = "https://gameslab.co.in,https://www.gameslab.co.in,http://localhost:4000"
TIMEZONE = "Asia/Kolkata"
HOLD_MINUTES = "10"
MAX_QTY_PER_BOOKING = "10"
