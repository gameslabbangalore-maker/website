name: Update calendar feed

on:
  # The site reads dates from the committed calendar.json, so a new Google
  # Calendar entry only becomes bookable once this has run. Keep it on a timer
  # rather than relying on someone remembering to trigger it.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate calendar artifact
        run: npm run build:calendar
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}

      - name: Commit and push changes
        run: |
          if [[ -n "$(git status --porcelain assets/data/calendar.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/calendar.json
            git commit -m "chore: update calendar feed"
            git push
          else
            echo "No calendar updates to commit."
          fi
